pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        maven { url = "https://maven.minecraftforge.net/" }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Toolchain provisioning for CI (runners ship JDK 21; the build pins a JDK 17 toolchain).
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.8.0"
}

rootProject.name = "wizardpedia"

include("wizardpedia-common")
project(":wizardpedia-common").projectDir = file("wizardpedia/common")
include("wizardpedia-fabric")
project(":wizardpedia-fabric").projectDir = file("wizardpedia/fabric")
include("wizardpedia-forge")
project(":wizardpedia-forge").projectDir = file("wizardpedia/forge")
